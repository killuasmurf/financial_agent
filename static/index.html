<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Financial Agent - Live Feed Test</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 10px; max-width: 700px; }
        input, button { padding: 10px; font-size: 14px; border-radius: 6px; border: 1px solid #475569; }
        input { width: 60%; background: #334155; color: white; }
        button { background: #2563eb; color: white; cursor: pointer; border: none; font-weight: bold; }
        #logs { margin-top: 20px; background: #020617; padding: 16px; border-radius: 6px; font-family: monospace; max-height: 300px; overflow-y: auto; }
        .log-entry { margin-bottom: 6px; padding: 4px 0; border-bottom: 1px solid #1e293b; color: #10b981; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Financial Agent Live Stream Test</h2>
        <p>Session ID: <strong id="sessionIdDisplay"></strong></p>

        <div>
            <input type="text" id="statusInput" placeholder="Type milestone (e.g. 'Parsed PDF')..." />
            <button onclick="publishTestEvent()">Simulate Celery Worker</button>
        </div>

        <div style="margin-top: 15px;">
            <input type="text" id="fileInput" placeholder="Enter file path (e.g. data/sample_report.pdf)..." />
            <button onclick="startRealResearch()">Process Document</button>
        </div>

        <h3>Live WebSocket Feed:</h3>
        <div id="logs"></div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h2>Ask the ReAct Agent</h2>
        <div>
            <input type="text" id="askInput" placeholder="e.g. What are SpaceX's supply chain risks?" />
            <button onclick="askAgent()">Ask</button>
        </div>
        <div id="agentResponse" style="margin-top: 15px; padding: 15px; background: #020617; border-radius: 6px; display: none;"></div>
    </div>

    <script>
        const sessionId = "session-" + Math.random().toString(36).substr(2, 9);
        document.getElementById("sessionIdDisplay").innerText = sessionId;

        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/${sessionId}`;
        const socket = new WebSocket(wsUrl);
        const logsDiv = document.getElementById("logs");

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            logsDiv.innerHTML += `<div class="log-entry">${new Date().toLocaleTimeString()} - ${JSON.stringify(data)}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        };

        async function publishTestEvent() {
            const text = document.getElementById("statusInput").value || "Default milestone progress";
            await fetch(`/test-publish/${sessionId}?message=${encodeURIComponent(text)}`, { method: "POST" });
            document.getElementById("statusInput").value = "";
        }

        async function startRealResearch() {
            const filePath = document.getElementById("fileInput").value || "data/sgx_report.pdf";
            await fetch(`/start-research/${sessionId}?file_path=${encodeURIComponent(filePath)}`, { method: "POST" });
            document.getElementById("fileInput").value = "";
        }

        async function askAgent() {
            const query = document.getElementById("askInput").value;
            const responseDiv = document.getElementById("agentResponse");
            
            responseDiv.style.display = "block";
            responseDiv.innerHTML = "<em>Agent is reasoning and searching vectors...</em>";
            
            const response = await fetch(`/ask?query=${encodeURIComponent(query)}`, { method: "POST" });
            const data = await response.json(); 

            // Print the exact structure to the browser console
            console.log("Raw data from server:", data); 
            
            responseDiv.innerHTML = `<strong>Answer:</strong><br>` + marked.parse(data.response[0].text);
            document.getElementById("askInput").value = "";
        }
    </script>
</body>
</html>
